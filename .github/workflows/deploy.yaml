name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

jobs:
  vars:
    if: github.repository == 'Muxi-X/forum-fe'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      deploy_dir: ${{ steps.vars.outputs.deploy_dir }}
      service: ${{ steps.vars.outputs.service }}
    steps:
      - name: Resolve deploy vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "image_tag=dev" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=~/forum-dev" >> "$GITHUB_OUTPUT"
            echo "service=forum_fe_dev" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=~/forum" >> "$GITHUB_OUTPUT"
            echo "service=forum_fe" >> "$GITHUB_OUTPUT"
          fi

  build:
    if: github.repository == 'Muxi-X/forum-fe'
    runs-on: ubuntu-latest
    needs: vars
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Aliyun Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          registry: registry.cn-shenzhen.aliyuncs.com

      - name: Build and push image
        run: |
          chmod +x ./scripts/push.sh
          ./scripts/push.sh ${{ secrets.IMAGE_REPO }} ${{ needs.vars.outputs.image_tag }}
  deploy:
    if: github.repository == 'Muxi-X/forum-fe'
    runs-on: ubuntu-latest
    needs:
      - vars
      - build
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      - name: SSH into server and deploy
        run: |
          ssh -i ~/.ssh/id_rsa \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER }} << EOF
            cd ${{ needs.vars.outputs.deploy_dir }}
            docker rm -f ${{ needs.vars.outputs.service }} || true
            docker pull ${{ secrets.IMAGE_REPO }}/forum_fe:${{ needs.vars.outputs.image_tag }}
            FE_IMAGE_TAG=${{ needs.vars.outputs.image_tag }} docker compose up -d ${{ needs.vars.outputs.service }}
          EOF
